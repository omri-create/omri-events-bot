services:
  - type: web
    name: omri-events-bot
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false

  - type: cron
    name: omri-events-bot-reminders
    runtime: node
    plan: starter
    schedule: "0 6 * * *"   # 06:00 UTC = 08:00/09:00 Asia/Jerusalem depending on DST
    buildCommand: npm install
    startCommand: npm run remind
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
